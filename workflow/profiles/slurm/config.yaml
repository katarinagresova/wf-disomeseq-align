# SLURM execution profile: one SLURM job per rule instance.
# Requires snakemake-executor-plugin-slurm in the `snake` env.

executor: slurm
use-conda: true
jobs: 30
printshellcmds: true
rerun-incomplete: true
keep-going: true
latency-wait: 60

# Profile resource values are evaluated as Python, so strings must be
# inner-quoted ("'normal'"). CPUs are the rules' threads.
# No slurm_account: SLURM uses your default account. Add
# slurm_account: "'your_account'" here if your cluster has none.
default-resources:
  slurm_partition: "'normal'"
  runtime: 240
  mem_mb: 8000
