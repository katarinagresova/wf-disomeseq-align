$schema: "https://json-schema.org/draft/2020-12/schema"
description: wf-disomeseq-align configuration
type: object
definitions:
  length_range:
    type: array
    items:
      type: integer
      minimum: 1
    minItems: 2
    maxItems: 2
properties:
  samples:
    type: string
    description: path to samples.tsv
  RESULTS_DIR:
    type: string
    default: results
  LOG_DIR:
    type: string
    default: logs
  adapter:
    type: string
    description: 3' adapter, trimmed off the reads
  randomer_5p:
    type: integer
    minimum: 0
    description: random nt at the 5' end of the read
  randomer_3p:
    type: integer
    minimum: 0
    description: random nt before the adapter
  minlength:
    type: integer
    minimum: 1
    description: shortest footprint (random nt removed) that is aligned
  disome_lengths:
    $ref: "#/definitions/length_range"
    description: shortest and longest disome footprint
  gel_lengths:
    $ref: "#/definitions/length_range"
    description: footprint lengths cut from the gel
  genome_fa:
    type: string
  annotation_gtf:
    type: string
  spike_in:
    type: object
    description: optional spike-in species, aligned to with the main one
    properties:
      genome_fa:
        type: string
      annotation_gtf:
        type: string
    required: [genome_fa, annotation_gtf]
    additionalProperties: false
  design:
    type: object
    description: experimental design, for the plots
    properties:
      replicate:
        type: string
        description: samples.tsv column with the biological replicate
      factors:
        type: object
        description: factor (a samples.tsv column) -> {level -> label}, levels in plot order
        additionalProperties:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
    additionalProperties: false
  read_classes:
    type: object
    description: plot label -> read classes of assign_reads.py, in stack order
    additionalProperties:
      type: array
      minItems: 1
      items:
        type: string
  contaminant_fastas:
    type: object
    description: contaminant type -> list of fasta paths
    # the type is part of the record names (<n>_<type>_<id>)
    propertyNames:
      pattern: "^[A-Za-z0-9]+$"
    additionalProperties:
      type: array
      items:
        type: string
    default: {}
required: [samples, adapter, randomer_5p, randomer_3p, minlength, disome_lengths, gel_lengths, genome_fa,
           annotation_gtf]
