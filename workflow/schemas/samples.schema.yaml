$schema: "https://json-schema.org/draft/2020-12/schema"
description: One row of samples.tsv. Other columns are allowed and ignored.
type: object
properties:
  sample_id:
    type: string
    # part of read names (no whitespace) and of the rules' <sample>:<file> arguments (no colon)
    pattern: "^[A-Za-z0-9._-]+$"
  fastq_1:
    type: string
  condition:
    type: string
    description: library preparation or treatment; the plots group libraries by it
required: [sample_id, fastq_1, condition]
