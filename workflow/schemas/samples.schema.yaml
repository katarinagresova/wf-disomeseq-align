$schema: "https://json-schema.org/draft/2020-12/schema"
description: One row of samples.tsv. Other columns are allowed and ignored.
type: object
properties:
  sample_id:
    type: string
    pattern: "^[^/]+$"
  fastq_1:
    type: string
  condition:
    type: string
    description: library preparation or treatment
required: [sample_id, fastq_1, condition]
