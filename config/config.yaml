# wf-disomeseq-align configuration. Paths are relative to where snakemake runs.
# For your own data, copy this file, edit it and run:
#   snakemake --configfile path/to/your/config.yaml

samples: "config/samples.tsv"
RESULTS_DIR: "results"
LOG_DIR: "logs"

# Read preprocessing (trim.smk). R1 is
#   5'-[randomer_5p random nt]-[footprint]-[randomer_3p random nt]-adapter-3'
# The random nt are UMIs: identical reads are collapsed before they are removed.
# minlength: the shortest footprint (random nt removed) that is aligned.
adapter: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
randomer_5p: 4
randomer_3p: 4
minlength: 25

# Footprint lengths (nt): monosome_lengths and disome_lengths are counted as
# monosome and disome footprints, gel_lengths is the size range cut from the
# gel.
monosome_lengths: [26, 34]
disome_lengths: [45, 75]
gel_lengths: [50, 70]

# Saturation figure (plots.smk): a gene is covered with this many disome
# molecules (footprints of gel_lengths) or more.
saturation_gene_molecules: 10

# Motif figure (plots.smk; optional): label -> regular expression on the
# one-letter amino acids of the CDS, matched in the reading frame. The disome
# footprints are counted around each match. Without it: the collision motifs of
# Han et al. 2020 (Cell Rep 31:107610), below.
# (Commented out: this file is merged into a config given with --configfile, so
# a motif set here would stay in every run.)
# motifs:
#   Pro-Pro: "PP"
#   Pro-Gly: "PG"
#   Pro-Asp: "PD"
#   Arg-X-Lys: "R.K"

# Reference (reference.smk): genome fasta and its GTF annotation (NCBI RefSeq
# GTF: transcript_biotype, CDS + stop_codon features). One transcript for each
# protein-coding gene is aligned to; the rRNA, tRNA, snRNA, snoRNA, scaRNA and
# miRNA of the annotation are contaminants.
genome_fa: "/path/to/genome.fa"
annotation_gtf: "/path/to/annotation.gtf"

# Optional spike-in species (e.g. a yeast lysate): genome fasta and NCBI RefSeq
# GTF, as for the main species. Its transcripts are aligned to with the main
# ones; its reads get their own BAM (bowtie/spike_in/). Its rRNA is not in the
# annotation's contaminants: add it to contaminant_fastas.
# spike_in:
#   genome_fa: "/path/to/spike_in_genome.fa"
#   annotation_gtf: "/path/to/spike_in_annotation.gtf"

# Experimental design, for the plots (plots.smk; optional). replicate: the
# samples.tsv column with the biological replicate. factors: samples.tsv
# columns, each with its levels in plot order and a label for each level (quote
# levels that look like numbers). Each condition of samples.tsv must be one
# combination of factor levels. Without a design, the plots keep the order of
# samples.tsv.
# design:
#   replicate: replicate
#   factors:
#     treatment:
#       A: "treatment A"
#       B: "treatment B"

# Read classes in the plots (plots.smk; optional): plot label -> read classes
# of the alignment (transcript, spike_in, multi, unaligned and the contaminant
# types: rRNA, tRNA, ncRNA, the types of contaminant_fastas, and spikeintRNA,
# spikeinncRNA with a spike-in), in stack order. At most 8 coloured groups; a
# group of only unaligned is grey; classes in no group are drawn as "other".
# Without it, each class is drawn on its own.
# read_classes:
#   mRNA: [transcript]
#   multi-mapping: [multi]
#   rRNA: [rRNA]
#   tRNA and other ncRNA: [tRNA, ncRNA, mt]
#   not aligned: [unaligned]

# More contaminants (contaminants.smk), by type: the type is the read class of
# the reads that align to them. Both strands of each sequence are added (mtDNA
# is transcribed from both).
# (Commented out: this file is merged into a config given with --configfile,
# so a type set here would stay in every run.)
# contaminant_fastas:
#   mt: ["/path/to/mtDNA.fa"]
#   rRNA: ["/path/to/rDNA.fa"]
